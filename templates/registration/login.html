{% extends 'base.html' %}
{% block title %}ورود | مهرا{% endblock %}

{% block content %}
<h2>ورود به حساب</h2>

<form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div class="form-group">
        <label for="id_username">نام کاربری</label>
        {{ form.username }}
    </div>
    <div class="form-group">
        <label for="id_password">رمز عبور</label>
        {{ form.password }}
    </div>

    <button type="submit" class="btn">ورود</button>

    <p class="auth-link">حساب نداری؟ <a href="{% url 'signup' %}">ثبت‌نام کن</a></p>

</form>
{% endblock %}
