{% extends 'base.html' %}
{% block title %}فروشگاه‌ها | مهرا{% endblock %}

{% block content %}
<h1>فروشگاه‌های مهرا</h1>
<div class="card-grid">
    {% for store in stores %}
        <div class="card">
            <h3>{{ store.name }}</h3>
            <p>{{ store.description|truncatewords:15 }}</p>
            <a href="{% url 'store_detail' store.id %}" class="btn">دیدن محصولات</a>
        </div>
    {% empty %}
        <p>هنوز فروشگاهی ثبت نشده است.</p>
    {% endfor %}
</div>
{% endblock %}
